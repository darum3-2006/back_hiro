name: CI

on:
  pull_request:
    branches: [main]
  # main へのマージ時にも実行してキャッシュを温める。
  push:
    branches: [main]

# 同じ PR で再 push されたら古い run を打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nuxt:
    name: nuxt (lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuxt
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: nuxt/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  nest:
    name: nest (lint / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: nest/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
