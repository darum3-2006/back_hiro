server {
    listen 80;
    #server_name your-domain.com;

    # 前段の ALB が X-Forwarded-For の末尾に追記したクライアント IP を $remote_addr として採用する。
    # - 信頼するのはプライベートアドレス（VPC 内の ALB）からの接続だけ。外から nginx へ直接来た
    #   リクエストの X-Forwarded-For は無視し、接続元 IP のまま扱う
    # - real_ip_recursive off なので末尾の 1 件（ALB が追記した値）だけを使う。クライアントが
    #   自分で付けた偽の値はそれより前に並ぶため採用されない
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # Nuxt (フロントエンド)
    location / {
        proxy_pass http://host.docker.internal:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Nuxt Icon のサーバルート（/api/_nuxt_icon/...）は Nuxt 側へ。
    # 下の /api より長い prefix なので優先的にマッチする。
    location /api/_nuxt_icon {
        proxy_pass http://host.docker.internal:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # NestJS (APIバックエンド)
    location /api {
        proxy_pass http://host.docker.internal:3101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # レート制限（IP 単位）用にクライアント IP（上の real_ip で解決済みの $remote_addr）を渡す。
        # $proxy_add_x_forwarded_for で追記するとクライアントが付けた偽の値が残るため、上書きする。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}
