name: CI

on:
  pull_request:
    branches: [main]
  # main へのマージ時にも実行してキャッシュを温める。
  push:
    branches: [main]

# 同じ PR で再 push されたら古い run を打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nuxt:
    name: nuxt (lint / format / typecheck, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # 片方の Node で落ちても、もう片方の結果も見られるようにする
      fail-fast: false
      matrix:
        # サポート対象の Node（package.json の engines と揃える）
        node: [24, 26]
    defaults:
      run:
        working-directory: nuxt
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: nuxt/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

  nest:
    name: nest (lint / format / test, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # 片方の Node で落ちても、もう片方の結果も見られるようにする
      fail-fast: false
      matrix:
        # サポート対象の Node（package.json の engines と揃える）
        node: [24, 26]
    defaults:
      run:
        working-directory: nest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: nest/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test
